    <h1 align="center"> Video locale</h1>
    <div align="center">
		<iframe width="640" height="360" 
				src="./data/movie.mp4"
				allowfullscreen>
		</iframe>
    </div>

    <h1 align="center"> Come incorporare un video youtube</h1>
	<h2 align="center"> Per incorporare un video you tube occorre aprire la pagina mediante protocollo http </h2>
	
	<!-- youTube -> Selezionare il video desiderato
                 ->	Condividi 
                 ->	Incorpora
				 -> Copiare l'intero iframe
				    (il path deve cominciare con www.youtube.com/embed/ )
	-->	

    <div align="center">
		<iframe width="560" height="315" 
			src="https://www.youtube.com/embed/SllXWF-9cMI?si=rt07lm7zIhlzKpP_" 
			title="YouTube video player" 
			frameborder="0" 
			allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
			referrerpolicy="strict-origin-when-cross-origin" 
			allowfullscreen>
		</iframe>
    </div>
