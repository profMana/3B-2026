<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese 12</title>
</head>
<body>
     <h1 align="center">Form e Controlli</h1>

    <form action="conferma.html">

        <!-- name serve per trasemttere i dati al server -->
        <!-- id serve esclusivamente per il collegamento con la label  -->
        <label for="txtNome">Nome: </label>
        <input type="text" name="txtNome" id="txtNome"  required 
               maxlength="15" placeholder="Inserisci qui il tuo nome">
        <br>

        <label for="txtCognome">Cognome: </label>
        <input type="text" name="txtCognome" id="txtCognome"  required 
               maxlength="15" placeholder="Inserisci qui il tuo cognome">
        <br>

        <label for="txtPasword">Password: </label>
        <input type="password" name="txtPasword" id="txtPasword"  required 
               maxlength="15" placeholder="Inserisci qui la tua password">
        <br>

        <!-- maxlength sui numeri non viene riconosciuto -->
        <label for="txtEta">Età: </label>
        <input type="number" name="txtEta" id="txtEta" required
               min="18" max="40" value="20">
        <br>

        <!-- su input type="file" non viene riconosciuto il placeholder-->
        <label for="txtImmagine">Immagine di profilo: </label>
        <input type="file" name="txtImmagine" id="txtImmagine">
        <br>
        <br>

        <!-- Per trasmettere correttamente al server un gruppo di checkbox,
             i checkbox DEVONO avere tutti lo stesso name -->
        <fieldset>
            <legend>Hobbies: </legend> 
            <input type="checkbox" name="chkHobbies" id="chkCalcio" value="calcio">
            <label for="chkCalcio">Calcio</label>
            <br>
            <input type="checkbox" name="chkHobbies" id="chkModellismo" value="modellismo">
            <label for="chkModellismo">Modellismo</label>
            <br>
            <input type="checkbox" name="chkHobbies" id="chkInformatica" value="informatica">   
            <label for="chkInformatica">Informatica</label>
        </fieldset>
        <br>
        <br>

        <!-- anche per i radio il name DEVE essere sempre lo stesso-->
        <span>Settore di studio</span> 
        <br>
        <input type="radio" name="optSettore" id="optInformatica" value="informatica">
        <label for="optInformatica">Informatica</label>
        <br>
        <input type="radio" name="optSettore" id="optMeccanica" value="meccanica">
        <label for="optMeccanica">Meccanica</label>
        <br>
        <input type="radio" name="optSettore" id="optElettrotecnica" value="elettrotecnica">
        <label for="optElettrotecnica">Elettrotecnica</label>
        <br>
        <br>

        <label for="txtCommenti">Commenti:</label>
        <br>
        <!-- per vedere il placeholder non deve esserci nulla tra il tag e il chiuso tag -->
        <textarea placeholder="inserisci qui i tuoi commenti" 
                  rows="5" cols="30" name="txtCommenti" id="txtCommenti">commento di prova</textarea>

        <p>
            <!-- I parametri vengono trasmessi al server in formato url-encoded -->
            <input type="reset" value="Reset">
            <input type="submit" value="Submit"
        </p>




    </form>


</body>
</html>
